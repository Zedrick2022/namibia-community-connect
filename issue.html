<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="View details of a community issue."
    >

    <title>Issue Details | Namibia Community Connect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav>

            <div class="logo">
                Namibia Community Connect
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="report.html">
                    Report an Issue
                </a>

                <a href="issues.html">
                    Community Issues
                </a>

            </div>

        </nav>

    </header>


    <main>

        <section class="issue-details-page">

            <a
                href="issues.html"
                class="back-link"
            >
                ← Back to Community Issues
            </a>


            <div
                id="issueDetails"
                class="issue-details-card"
            >
            </div>


            <div
                id="issueNotFound"
                class="empty-state"
            >

                <h2>
                    Issue not found
                </h2>

                <p>
                    We couldn't find the community issue
                    you're looking for.
                </p>

                <a
                    href="issues.html"
                    class="button primary"
                >
                    View Community Issues
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Namibia Community Connect
        </p>

        <p>
            Built for the community, by the community.
        </p>

    </footer>


    <script src="js/issue.js"></script>

</body>

</html>
